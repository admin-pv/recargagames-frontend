# ══════════════════════════════════════════════════════════════════════════
# IMPORTANTE: estas regras estão duplicadas em _redirects, na mesma ordem.
# O Netlify avalia as regras do netlify.toml primeiro e depois as do
# _redirects; o _redirects é mantido em sync por portabilidade.
# Mudou aqui, muda lá. O _redirects tem os comentários longos explicando
# cada bloco — este arquivo é a versão curta.
# ══════════════════════════════════════════════════════════════════════════

# ── 1. /app/ não é endereço público ───────────────────────────────────────
# O gate (netlify/edge-functions/gate.ts) só casa com /br, /br/* e
# /_gate/auth. Sem isto, /app/* serviria a loja sem senha. Forçada porque os
# arquivos existem e venceriam uma regra não-forçada.
[[redirects]]
  from = "/app/*"
  to = "/br/:splat"
  status = 301
  force = true

# ── 1b. /docs/ não é endereço público ─────────────────────────────────────
# O publish directory é a raiz do repo; docs/ é documentação interna, não
# conteúdo de site. Forçada porque os arquivos existem.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

