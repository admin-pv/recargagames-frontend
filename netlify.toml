# ── 3. Mercados → arquivos em /app/ ───────────────────────────────────────
# A regra SPA antiga (/br/* → /br/index.html 200) saiu: o frontend v2 são
# páginas .html de verdade, não um router client-side.
# Sem force: arquivos existentes (/br/_gate.html) têm precedência, que é o
# que mantém a Edge Function do gate funcionando.
[[redirects]]
  from = "/br/"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/br/*"
  to = "/app/:splat"
  status = 200

